<body>

<nav class="navbar">

<main class="main-content">
    <section class="join-section">
        <h2>Свържи се с нас</h2>
        <p>Попълни формата и ние ще се свържем с теб възможно най-скоро.</p>
        <form class="join-form">
            <label for="name">Име</label>
            <input type="text" id="name" placeholder="Твоето име..." required>

            <label for="lname">Фамилия:</label>
            <input type="text" id="lname" name="lname" required>

            <label for="email">Имейл:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Парола:</label>
            <input type="password" id="password" name="password" required>

            <label for="reason">Защо искаш да се присъединиш:</label>
            <input type="text" id="reason" name="reason" required>

            <label for="interview">Интервю:</label>
            <input type="datetime-local" id="interview" name="interview" required>

            <button type="submit">Изпрати</button>
            <button type="reset">Изчисти формуляра</button>
        </form>
    </section>
</main>

</body>
</html>
