<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <title>Свържи се с психолог</title>
  <link rel="stylesheet" href="css/join.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="final.html" class="logo">Put yourself first</a>
    <ul class="nav-links">
      <li><a href="final.html">Начало</a></li>
      <li><a href="test.html">Тестове</a></li>
      <li><a href="post.html">Постове</a></li>
      <li><a href="psiho.html">Свържи се с психолог</a></li>
      <li><a href="EON.html">Един от нас</a></li>
    </ul>
  </div>
</nav>

<main class="main-content">
  <section class="join-section">
    <h2>Свържи се с психолог</h2>
    <p>Попълни формата и психолог ще се свърже с теб.</p>

    <form class="join-form" onsubmit="return validateForm()">
      <label for="fname">Име:</label>
      <input type="text" id="fname" name="fname" required>

      <label for="lname">Фамилия:</label>
      <input type="text" id="lname" name="lname" required>

      <label for="email">Имейл:</label>
      <input type="text" id="email" name="email" required>

      <label for="password">Парола:</label>
      <input type="text" id="password" name="password" required>

      <label for="reason">С какво имате нужда от съдействие:</label>
      <input type="text" id="reason" name="reason" required>

      <label for="interview">Сеанс:</label>
      <input type="datetime-local" id="interview" name="interview" required>

      <button type="submit">Изпрати</button>
      <button type="reset">Изчисти формуляра</button>
    </form>
  </section>
</main>

<script src="js/join.js"></script>
</body>
</html>
